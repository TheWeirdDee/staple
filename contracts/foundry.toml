[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = []
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
via_ir = true
fs_permissions = [{ access = "read", path = "../reference/vectors" }]

[fmt]
line_length = 110

[lint]
# Reviewed: timestamp comparisons are intended (sequencer time is a documented trust assumption) and casts are
# bounded by policy validation. Run `forge lint` explicitly to see them.
lint_on_build = false
